name: 'Release'
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and push image to Google Artifact Registry
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghent-squash-booker
      GCP_REGION: europe-west1
      GCP_PROJECT: ghent-squash-booker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
          export_default_credentials: true

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Configure Docker Client
        run: gcloud auth configure-docker europe-docker.pkg.dev --quiet

      - name: Push Docker image to Artifact Registry
        run: |-
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.GCP_REGION }}.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.GCP_REGION }}.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
